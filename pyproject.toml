[project]
name = "fleetview"
version = "0.0.0"
description = "Local-first control plane for orchestrating and observing subscription-authenticated coding agents"
requires-python = ">=3.12"
dependencies = [
    "libtmux>=0.37",
    "typer>=0.12",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
fleetview = "fleetview.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# The load gate drives a real daemon for ~20s, so it is out of the default run
# -- but it must stay routinely runnable (`pytest -m load`), because a gate run
# once and then left to rot proves nothing about the code as it is now.
addopts = "-m 'not load'"
markers = [
    "load: sustained-throughput gate (PROJECT_PLAN.md §7). Run with `pytest -m load`.",
    "tmux: needs a real tmux binary.",
]
