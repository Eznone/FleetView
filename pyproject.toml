[project]
name = "fleetview"
version = "0.0.0"
description = "Local-first control plane for orchestrating and observing subscription-authenticated coding agents"
requires-python = ">=3.12"
dependencies = [
    "libtmux>=0.37",
    "typer>=0.12",
]

[project.scripts]
fleetview = "fleetview.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
